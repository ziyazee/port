spring.application.name=port
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
porter.document-storage.provider=${PORTER_DOCUMENT_STORAGE_PROVIDER:gcs}
porter.document-storage.gcs.bucket-name=${PORTER_GCS_BUCKET_NAME:}
porter.document-storage.gcs.project-id=${PORTER_GCS_PROJECT_ID:}
porter.document-storage.gcs.object-prefix=${PORTER_GCS_OBJECT_PREFIX:documents}
porter.document-storage.gcs.credentials-path=${PORTER_GCS_CREDENTIALS_PATH:}
porter.gps.wialon.enabled=${PORTER_GPS_WIALON_ENABLED:false}
porter.gps.wialon.base-url=${PORTER_GPS_WIALON_BASE_URL:https://hst-api.wialon.com/wialon/ajax.html}
porter.gps.wialon.token=${WIALON_TOKEN:}
porter.gps.wialon.connect-timeout-ms=${PORTER_GPS_WIALON_CONNECT_TIMEOUT_MS:5000}
porter.gps.wialon.read-timeout-ms=${PORTER_GPS_WIALON_READ_TIMEOUT_MS:10000}
porter.maps.google.enabled=${PORTER_MAPS_GOOGLE_ENABLED:false}
porter.maps.google.base-url=${PORTER_MAPS_GOOGLE_BASE_URL:https://maps.googleapis.com/maps/api/geocode/json}
porter.maps.google.api-key=${GOOGLE_MAPS_API_KEY:}
porter.maps.google.language=${PORTER_MAPS_GOOGLE_LANGUAGE:en}
porter.maps.google.region=${PORTER_MAPS_GOOGLE_REGION:sa}
porter.maps.google.connect-timeout-ms=${PORTER_MAPS_GOOGLE_CONNECT_TIMEOUT_MS:5000}
porter.maps.google.read-timeout-ms=${PORTER_MAPS_GOOGLE_READ_TIMEOUT_MS:10000}
